:root.cmode button.pencil{display:inline-flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;min-width:30px;padding:0;margin-left:auto;border:0;border-radius:var(--r-sm);background:none;color:var(--muted);cursor:pointer}
:root.cmode button.pencil .ic{width:18px;height:18px}
:root.cmode button.pencil:hover{background:var(--surface-2)}
:root.cmode .meta>button.pencil{order:9;margin:-7px 0}   /* no icon row on this card: right end of the detail line, without making the line taller */
.meta>button.pencil::before{content:none}
.fld select{display:block;width:100%;font:inherit;font-size:16px;padding:9px 10px;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);color:var(--ink)}
.fld select[aria-invalid=true]{border-color:var(--warn);border-width:2px}
.fld .fnote.note-top{margin:0 0 4px}
fieldset.scope{margin:0 0 12px;padding:0;border:0}
fieldset.scope legend{padding:0;margin-bottom:2px;font-size:.85rem;font-weight:600}
fieldset.scope label{display:flex;align-items:center;gap:8px;min-height:36px;font-size:.9rem}
fieldset.scope input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.csum{margin:0 0 12px;font-size:.85rem;color:var(--ink-2);font-weight:600}
/* suggestion dialog */
dialog.subd{width:min(460px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);box-shadow:var(--pop);overflow:auto}
dialog.subd::backdrop{background:rgba(0,0,0,.55)}
.fbox{padding:16px}
.fbox h2{margin:0 0 4px;font-size:1.2rem;color:var(--accent)}
.fbox .fhint{margin:0 0 12px;color:var(--muted);font-size:.85rem}
.fld{margin:0 0 12px}
.fld label{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px}
.fld .opt{font-weight:400;color:var(--muted)}
.fld input,.fld textarea{display:block;width:100%;font:inherit;font-size:16px;padding:9px 10px;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
.fld textarea{min-height:110px;resize:vertical}
.fld input[aria-invalid=true],.fld textarea[aria-invalid=true]{border-color:var(--warn);border-width:2px}
.fld .fnote{font-size:.78rem;color:var(--muted);margin-top:2px}
.fld .ferr,.fmsg.bad{color:var(--warn);font-weight:600}
.fld .ferr{font-size:.82rem;margin-top:3px}
.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.tsbox{min-height:70px;margin:0 0 12px;overflow:hidden}
.fmsg{font-size:.9rem;margin:0 0 12px}
.fbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fbtns button{font:inherit;font-weight:600;min-height:44px;padding:8px 18px;border-radius:var(--r-pill);cursor:pointer;border:1px solid var(--accent)}
.fbtns .go{background:var(--accent);color:var(--accent-ink)}
.fbtns .no{background:none;color:var(--accent)}
.fbtns button[disabled]{opacity:.6;cursor:wait}
.fdone{padding:4px 0}
.fdone:focus{outline:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* desktop: one centred column, wider gutter */
@media (min-width:960px){
:root{--maxw:820px;--gut:24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-size:1.75rem}
.updated{margin:0 0 6px}
section.day>ul{padding:4px var(--gut) 0}   /* cards share the search box's edges */
/* icons at the right end of the detail line, bottom-aligned (labelled pills mode keeps them on their own row) */
:root[data-acts=icons] li.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:end;padding:12px 18px 10px}
:root[data-acts=icons] .acts{grid-column:2;grid-row:1;flex-wrap:nowrap;margin:0 -6px -4px 0}
:root:not([data-acts=icons]) li.ev{padding:14px 18px 8px}
:root:not([data-acts=icons]) .acts{margin-top:6px}
.day+.day{margin-top:28px}
}
</style>
