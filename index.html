<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Twin Cities Live Music</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#6a6a64;--line:#e1e0d8;--card:#fff;--accent:#b4401f;--chip:#efeee6;--chip-on:#1d1d1b;--chip-on-fg:#fff;--star:#d99a00;--warn:#a1260f;--hdr:#f1f0e8}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe4;--muted:#9c9b92;--line:#2c2c29;--card:#1c1c1a;--accent:#ff8a5c;--chip:#272724;--chip-on:#ecebe4;--chip-on-fg:#141413;--star:#f2b922;--warn:#ff7b63;--hdr:#1a1a18}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{padding:16px 16px 4px;max-width:760px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 2px}
.updated{color:var(--muted);font-size:.85rem}
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.jump label{font-size:.85rem;color:var(--muted)}
.jump input[type=date]{font:inherit;font-size:.9rem;padding:4px 8px;min-height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.day{scroll-margin-top:0}
.filters{position:relative;max-width:760px;margin:8px auto 0;padding:0 16px 8px;border-bottom:1px solid var(--line)}
.filters summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}
.filters summary::-webkit-details-marker{display:none}
.filters summary::after{content:" \25BE"}
.frow{margin:8px 0}
.flabel{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer;min-height:32px}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%}
label.tog{display:flex;gap:8px;align-items:center;font-size:.95rem;min-height:32px}
.clear{background:none;border:0;color:var(--accent);font:inherit;font-size:.85rem;cursor:pointer;padding:6px 0}
main{max-width:760px;margin:0 auto;padding:0 0 48px}
.status{max-width:760px;margin:0 auto;padding:8px 16px;color:var(--muted);font-size:.85rem}
.day+.day{margin-top:22px}
.day h2{position:sticky;top:0;z-index:2;margin:0;padding:10px 16px;font-size:1.1rem;font-weight:800;letter-spacing:.01em;background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--fg);border-left:6px solid var(--accent);border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,var(--bg))}
.day h2 small{color:inherit;opacity:.7;font-size:.8rem;font-weight:500;margin-left:8px}
ul{list-style:none;margin:0;padding:0}
li.ev{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.l1{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.h{font-weight:700;color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
a.h:hover,a.h:focus{text-decoration:underline;color:var(--accent)}
.star{color:var(--star);margin-right:3px}
.time{white-space:nowrap;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.op{color:var(--fg);font-size:.92rem;margin-top:1px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.85rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:.75rem;color:var(--fg);background:var(--chip)}
.tag.other{color:var(--muted)}
.badge{font-size:.75rem;font-weight:700;color:var(--warn);text-transform:uppercase}
.rec{font-size:.8rem;color:var(--accent);font-weight:600}
.also a{color:var(--muted);font-size:.8rem}
.more{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;text-align:left}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
footer{max-width:760px;margin:0 auto;padding:16px;color:var(--muted);font-size:.8rem}
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

6-758805"},{"h":"Beer \u0026 Clay: Cutout Ornaments","o":[],"v":"56 Brewing","c":"Minneapolis","d":"2026-12-06","t":"12:00","g":"country/folk/Americana","z":"T5","s":"https://56brewing.com/event/beer-clay-cutout-ornaments/"},{"h":"Frank Randall","o":["Pete Hofmann","Chris Lynch"],"v":"The White Squirrel Bar","c":"St. Paul","d":"2026-12-06","t":"13:00","g":"rock/indie","z":"T5","s":"https://whitesquirrelbar.com/event/frank-randall-w-pete-hofmann-chris-lynch/"},{"h":"Dowser","o":["Vicki Dischler","the Eitel Brothers"],"v":"The White Squirrel Bar","c":"St. Paul","d":"2026-12-06","t":"18:00","g":"rock/indie","z":"T5","s":"https://whitesquirrelbar.com/event/dowser-w-vicki-dischler-the-eitel-brothers/"},{"h":"Skwhirl","o":[],"v":"Pilllar FORUM Cafe \u0026 Commodities","c":"Minneapolis","d":"2026-12-06","t":"18:30","g":"rock/indie","z":"T5","s":"https://www.pilllar.com/collections/tickets/products/music-skwhirl-12-6-2026"},{"h":"Brass Messengers","o":[],"v":"331 Club","c":"Minneapolis","d":"2026-12-06","t":"19:00","g":"country/folk/Americana","z":"T5","s":"https://www.facebook.com/profile.php?id=100063684781557\u0026mibextid=LQQJ4d"},{"h":"Scarlett Tangerines","o":["Faux Pseudo","The Moby Dick Band"],"v":"The White Squirrel Bar","c":"St. Paul","d":"2026-12-06","t":"21:00","g":"rock/indie","z":"T5","s":"https://whitesquirrelbar.com/event/scarlett-tangerines-w-faux-pseudo-the-moby-dick-band/"}],"limit":10,"updated":"Nov 8, 2026","window":"Nov 8 – Dec 6","footer":"Listings are collected from venue calendars and public listings each week and may be incomplete or out of date; check the venue before you go."}</script>
<script>
"use strict";
(function(){
var D=JSON.parse(document.getElementById("data").textContent);
var EV=D.events, LIMIT=D.limit;
var SIZE={T1:"Arena",T2:"Large theater",T3:"Mid-size",T4:"Club",T5:"Small room"};
var KEY="tcmusic.filters.v1";
var st={genres:[],tiers:[],city:"",hidden:false};
var expanded={};
try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);
 if(Array.isArray(s.genres))st.genres=s.genres.filter(function(x){return typeof x==="string"});
 if(Array.isArray(s.tiers))st.tiers=s.tiers.filter(function(x){return SIZE[x]});
 if(typeof s.city==="string")st.city=s.city; st.hidden=s.hidden===true;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function safeUrl(u){try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch(e){return null}}
function genreLabel(g){return g?g.charAt(0).toUpperCase()+g.slice(1):"Other"}
function fmtTime(t){if(!t)return"Time TBA";var p=t.split(":"),h=+p[0],m=p[1],ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+m+" "+ap}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDay(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate()}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

// ---- filter UI (built once) ----
var genres=[],cities=[],gSeen={},cSeen={};
EV.forEach(function(e){if(!gSeen[e.g]){gSeen[e.g]=1;genres.push(e.g)}if(!cSeen[e.c]){cSeen[e.c]=1;cities.push(e.c)}});
genres.sort(function(a,b){return a==="other"?1:b==="other"?-1:a<b?-1:1});cities.sort();
function chip(parent,label,on,fn){var b=el("button","chip",label);b.type="button";b.setAttribute("aria-pressed",on?"true":"false");b.onclick=function(){fn();save();syncUI();render()};parent.appendChild(b);return b}
function toggle(arr,v){var i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1)}
var gBox=document.getElementById("f-genre"),sBox=document.getElementById("f-size"),citySel=document.getElementById("f-city"),hid=document.getElementById("f-hidden");
var gBtn={},sBtn={};
genres.forEach(function(g){gBtn[g]=chip(gBox,genreLabel(g),false,function(){toggle(st.genres,g)})});
["T1","T2","T3","T4","T5"].forEach(function(t){sBtn[t]=chip(sBox,SIZE[t],false,function(){toggle(st.tiers,t)})});
citySel.appendChild(new Option("All cities",""));cities.forEach(function(c){citySel.appendChild(new Option(c,c))});
citySel.onchange=function(){st.city=citySel.value;save();syncUI();render()};
hid.onchange=function(){st.hidden=hid.checked;save();syncUI();render()};
document.getElementById("f-clear").onclick=function(){st={genres:[],tiers:[],city:"",hidden:false};save();syncUI();render()};
function active(){return st.genres.length+st.tiers.length+(st.city?1:0)+(st.hidden?1:0)}
function syncUI(){
 genres.forEach(function(g){gBtn[g].setAttribute("aria-pressed",st.genres.indexOf(g)>=0)});
 Object.keys(sBtn).forEach(function(t){sBtn[t].setAttribute("aria-pressed",st.tiers.indexOf(t)>=0)});
 if(cSeen[st.city]!==1)st.city="";citySel.value=st.city;hid.checked=st.hidden;
 var n=active();document.getElementById("fsum").textContent="Filters"+(n?" ("+n+" on)":"");
}

// ---- rendering ----
function matches(e){
 if(e.hid&&!st.hidden)return false;
 if(st.genres.length&&st.genres.indexOf(e.g)<0)return false;
 if(st.tiers.length&&st.tiers.indexOf(e.z)<0)return false;
 if(st.city&&e.c!==st.city)return false;
 return true;
}
function card(e){
 var li=el("li","ev"),l1=el("div","l1"),left=el("div");
 if(e.p){var s=el("span","star","\u2605");s.title="Pinned artist";s.setAttribute("aria-label","Pinned artist");left.appendChild(s)}
 var u=safeUrl(e.s),h;
 if(u){h=el("a","h",e.h);h.href=u;h.target="_blank";h.rel="noopener noreferrer"}else h=el("span","h",e.h);
 left.appendChild(h);l1.appendChild(left);
 l1.appendChild(el("span","time",e.r?"every "+e.r.replace(/^every\s+/i,"")+" \u00b7 "+fmtTime(e.t):fmtTime(e.t)));
 li.appendChild(l1);
 if(e.o&&e.o.length)li.appendChild(el("div","op","with "+e.o.join(", ")));
 var m=el("div","meta");
 m.appendChild(el("span",null,e.v+" \u00b7 "+e.c));
 m.appendChild(el("span","tag"+(e.g==="other"?" other":""),genreLabel(e.g)));
 if(e.x)m.appendChild(el("span","badge",e.x.replace("_"," ")));
 if(e.hid==="dj_night")m.appendChild(el("span","rec","DJ night"));
 if(e.a&&e.a.length){var al=el("span","also");al.appendChild(document.createTextNode("also on "));
  e.a.forEach(function(x,i){var au=safeUrl(x.u);if(i)al.appendChild(document.createTextNode(", "));
   if(au){var a=el("a",null,x.n);a.href=au;a.target="_blank";a.rel="noopener noreferrer";al.appendChild(a)}else al.appendChild(document.createTextNode(x.n))});
  m.appendChild(al)}
 li.appendChild(m);return li;
}
var daysEl=document.getElementById("days"),statusEl=document.getElementById("status");
function render(){
 var today=todayISO(),groups=[],byDate={},total=0;
 EV.forEach(function(e){
  if(e.d<today||!matches(e))return;
  var g=byDate[e.d];if(!g){g=byDate[e.d]=[];groups.push([e.d,g])}g.push(e);total++;
 });
 var frag=document.createDocumentFragment();
 groups.forEach(function(pair){
  var d=pair[0],list=pair[1],sec=el("section","day"),h=el("h2",null,fmtDay(d));sec.id="d-"+d;sec.setAttribute("data-date",d);
  h.appendChild(el("small",null,list.length+(list.length===1?" show":" shows")));sec.appendChild(h);
  var ul=el("ul"),all=expanded[d],n=all?list.length:Math.min(LIMIT,list.length);
  for(var i=0;i<n;i++)ul.appendChild(card(list[i]));
  sec.appendChild(ul);
  if(list.length>n){var b=el("button","more","Show "+(list.length-n)+" more");b.type="button";
   b.onclick=function(){expanded[d]=true;render()};sec.appendChild(b)}
  frag.appendChild(sec);
 });
 daysEl.textContent="";
 if(!groups.length)daysEl.appendChild(el("div","empty","No shows match these filters."));else daysEl.appendChild(frag);
 statusEl.textContent=total+(total===1?" show":" shows")+" across "+groups.length+(groups.length===1?" day":" days");
}
document.getElementById("updated").textContent="Updated "+D.updated+" \u00b7 "+D.window;
var foot=document.getElementById("foot");
foot.textContent=D.footer;
// ---- jump to date (scrolls only; not saved; shareable as #YYYY-MM-DD) ----
var jumpIn=document.getElementById("jump-date"),quick=document.getElementById("quick");
var ISO=/^\d{4}-\d{2}-\d{2}$/;
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dow(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay()}
var lastDay="";EV.forEach(function(e){if(e.d>lastDay)lastDay=e.d});
function setupJump(){
 var today=todayISO();jumpIn.min=today;if(lastDay)jumpIn.max=lastDay;
 quick.textContent="";
 var picks=[[today,"Today"]];
 [5,6,0].forEach(function(w){var d=today;while(dow(d)!==w)d=addDays(d,1);
  if(d!==today)picks.push([d,DOW[w]])});
 picks.sort(function(a,b){return a[0]<b[0]?-1:1});
 picks.forEach(function(p){if(lastDay&&p[0]>lastDay)return;
  var b=el("button","chip",p[1]);b.type="button";b.title=fmtDay(p[0]);
  b.onclick=function(){jumpTo(p[0],true)};quick.appendChild(b)});
}
function jumpTo(iso,setHash){
 if(!ISO.test(iso))return;
 var secs=daysEl.querySelectorAll("section.day"),target=null;
 for(var i=0;i<secs.length;i++){if(secs[i].getAttribute("data-date")>=iso){target=secs[i];break}}
 jumpIn.value=iso;
 if(setHash){try{history.replaceState(null,"","#"+iso)}catch(e){}}
 if(!target){statusEl.textContent="No shows on or after "+fmtDay(iso)+(active()?" with these filters.":".");return}
 var smooth=!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
 target.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
 var td=target.getAttribute("data-date");
 if(td!==iso)statusEl.textContent="No shows on "+fmtDay(iso)+(active()?" with these filters":"")+"; showing "+fmtDay(td)+".";
}
jumpIn.onchange=function(){if(jumpIn.value)jumpTo(jumpIn.value,true)};
jumpIn.addEventListener("click",function(){try{if(jumpIn.showPicker)jumpIn.showPicker()}catch(e){}});
function fromHash(){var h=location.hash.slice(1);if(ISO.test(h))jumpTo(h,false)}
window.addEventListener("hashchange",fromHash);
syncUI();render();setupJump();fromHash();
})();
</script>
</body>
</html>
