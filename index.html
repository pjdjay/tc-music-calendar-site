*{box-sizing:border-box}
[hidden]{display:none!important}

["T1","T2","T3","T4","T5"].forEach(function(t){sBtn[t]=chip(sBox,SIZE[t],false,function(){toggle(st.tiers,t)})});
citySel.appendChild(new Option("All cities",""));cities.forEach(function(c){citySel.appendChild(new Option(c,c))});
citySel.onchange=function(){st.city=citySel.value;save();syncUI();render()};
hid.onchange=function(){st.hidden=hid.checked;save();syncUI();render()};
newBox.onchange=function(){st.onlyNew=newBox.checked;save();syncUI();render()};
document.getElementById("f-clear").onclick=function(){st={genres:[],tiers:[],city:"",hidden:false,onlyNew:false,venues:st.venues};save();syncUI();render()};
function active(){return st.genres.length+st.tiers.length+(st.city?1:0)+(st.hidden?1:0)+(st.onlyNew?1:0)}
function syncUI(){
 genres.forEach(function(g){gBtn[g].setAttribute("aria-pressed",st.genres.indexOf(g)>=0)});
 Object.keys(sBtn).forEach(function(t){sBtn[t].setAttribute("aria-pressed",st.tiers.indexOf(t)>=0)});
 if(cSeen[st.city]!==1)st.city="";citySel.value=st.city;hid.checked=st.hidden;newBox.checked=st.onlyNew;
 var n=active();document.getElementById("fsum").textContent="Filters"+(n?" ("+n+" on)":"");
}

// ---- rendering ----
function matches(e){
 if(e.hid&&!st.hidden)return false;
 if(st.genres.length&&st.genres.indexOf(e.g)<0)return false;
 if(st.tiers.length&&st.tiers.indexOf(e.z)<0)return false;
 if(st.city&&e.c!==st.city)return false;
 if(st.onlyNew&&!e.n)return false;
 if(st.venues.length&&st.venues.indexOf(e.v)<0)return false;
 if(q.k&&!e._a.some(function(n){return n.indexOf(q.k)>=0}))return false;
 return true;
}
function searching(){return st.venues.length>0||q.k!==""}
function card(e){
 var li=el("li","ev"),l1=el("div","l1"),left=el("div");
 if(e.p){var s=el("span","star","\u2605");s.title="Pinned artist";s.setAttribute("aria-label","Pinned artist");left.appendChild(s)}
 var u=safeUrl(e.s),h;
 if(u){h=el("a","h",e.h);h.href=u;h.target="_blank";h.rel="noopener noreferrer"}else h=el("span","h",e.h);
 left.appendChild(h);l1.appendChild(left);
 l1.appendChild(el("span","time",e.r?"every "+e.r.replace(/^every\s+/i,"")+" \u00b7 "+fmtTime(e.t):fmtTime(e.t)));
 li.appendChild(l1);
 if(e.o&&e.o.length)li.appendChild(el("div","op","with "+e.o.join(", ")));
 var m=el("div","meta");
 var ms=el("span"),vb=el("button","vlink",e.v);vb.type="button";vb.title="Show only "+e.v;
 vb.onclick=function(){addVenue(e.v);window.scrollTo({top:0,behavior:smooth()?"smooth":"auto"})};
 ms.appendChild(vb);ms.appendChild(document.createTextNode(" \u00b7 "+e.c));m.appendChild(ms);
 m.appendChild(el("span","tag"+(e.g==="other"?" other":""),genreLabel(e.g)));
 if(e.n)m.appendChild(el("span","new","New"));
 if(e.x)m.appendChild(el("span","badge",e.x.replace("_"," ")));
 if(e.hid==="dj_night")m.appendChild(el("span","rec","DJ night"));
 if(e.a&&e.a.length){var al=el("span","also");al.appendChild(document.createTextNode("also on "));
  e.a.forEach(function(x,i){var au=safeUrl(x.u);if(i)al.appendChild(document.createTextNode(", "));
   if(au){var a=el("a",null,x.n);a.href=au;a.target="_blank";a.rel="noopener noreferrer";al.appendChild(a)}else al.appendChild(document.createTextNode(x.n))});
  m.appendChild(al)}
 li.appendChild(m);return li;
}
var daysEl=document.getElementById("days"),statusEl=document.getElementById("status");
function isoPlus(iso,days){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+days);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var START=D.start||todayISO(),NOTE="Small venues usually post shows 2\u20136 weeks ahead, so later weeks lean toward larger venues.";
function render(){
 var S=searching(),today=todayISO(),groups=[],byDate={},total=0,cut=S?"\uffff":isoPlus(START,shown*7),wk5=isoPlus(START,28); // a search looks at all 12 weeks
 EV.forEach(function(e){
  if(e.d<today||e.d>=cut||!matches(e))return;
  var g=byDate[e.d];if(!g){g=byDate[e.d]=[];groups.push([e.d,g])}g.push(e);total++;
 });
 var frag=document.createDocumentFragment(),noted=S||shown<=STEP;
 function note(){frag.appendChild(el("div","wknote",NOTE));noted=true}
 groups.forEach(function(pair){
  var d=pair[0],list=pair[1],sec=el("section","day"),h=el("h2",null,fmtDay(d));sec.id="d-"+d;sec.setAttribute("data-date",d);
  if(!noted&&d>=wk5)note();
  h.appendChild(el("small",null,list.length+(list.length===1?" show":" shows")));sec.appendChild(h);
  var ul=el("ul"),all=S||expanded[d],n=all?list.length:Math.min(LIMIT,list.length);
  for(var i=0;i<n;i++)ul.appendChild(card(list[i]));
  sec.appendChild(ul);
  if(list.length>n){var b=el("button","more","Show "+(list.length-n)+" more");b.type="button";
   b.onclick=function(){expanded[d]=true;render()};sec.appendChild(b)}
  frag.appendChild(sec);
 });
 if(!noted)note();
 daysEl.textContent="";
 if(!groups.length&&(S||shown<=STEP))daysEl.appendChild(el("div","empty","No shows match these filters."));else daysEl.appendChild(frag);
 statusEl.textContent="";
 if(S){statusEl.appendChild(document.createTextNode(total+(total===1?" show matches":" shows match")));
  var ca=el("button","linkbtn","Clear all");ca.type="button";ca.onclick=clearSearch;statusEl.appendChild(ca)}
 else statusEl.textContent=total+(total===1?" show":" shows")+" across "+groups.length+(groups.length===1?" day":" days")+" in the next "+shown+" weeks";
 nextBtn.hidden=S||shown>=WEEKS;
}
var nextBtn=document.getElementById("nextwk");nextBtn.textContent="Show next "+STEP+" weeks";
nextBtn.onclick=function(){shown=Math.min(WEEKS,shown+STEP);render()};
document.getElementById("updated").textContent="Updated "+D.updated+" \u00b7 "+D.window;
var foot=document.getElementById("foot");
foot.textContent=D.footer;
// ---- search: names are normalized and indexed once on load ----
function smooth(){return!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
var VIDX=Object.create(null),AIDX=Object.create(null),vKnown=Object.create(null),T0=todayISO();
EV.forEach(function(e){
 var names=[e.h].concat(e.o||[]);e._a=names.map(norm);vKnown[e.v]=1;
 if(e.d<T0)return;                                   // only upcoming shows are suggested
 var v=VIDX[e.v];if(v)v.c++;else VIDX[e.v]={n:e.v,k:norm(e.v),c:1};
 var seen={};
 names.forEach(function(n,i){var k=e._a[i];if(!k||seen[k])return;seen[k]=1;var a=AIDX[k];if(a)a.c++;else AIDX[k]={n:n,k:k,c:1}});
});
if(st.venues.length)st.venues=st.venues.filter(function(x){return vKnown[x]});
function toList(m){return Object.keys(m).map(function(k){return m[k]})}
var VLIST=toList(VIDX),ALIST=toList(AIDX);
function rank(k,t){var i=k.indexOf(t);return i<0?-1:i===0?0:k.indexOf(" "+t)>=0?1:2}
function pick(list,t,skip){var out=[];
 for(var i=0;i<list.length;i++){if(skip&&skip(list[i]))continue;var r=rank(list[i].k,t);if(r>=0)out.push([r,list[i]])}
 out.sort(function(a,b){return a[0]-b[0]||b[1].c-a[1].c||(a[1].n<b[1].n?-1:a[1].n>b[1].n?1:0)});
 return out.slice(0,6).map(function(x){return x[1]})}
var inp=document.getElementById("q"),sug=document.getElementById("sug"),qclear=document.getElementById("qclear"),sel=document.getElementById("sel"),sbar=document.getElementById("sbar");
var opts=[],act=-1,timer=0;
function setAct(i){
 if(act>=0&&opts[act])opts[act].el.setAttribute("aria-selected","false");
 act=i;
 if(i>=0&&opts[i]){opts[i].el.setAttribute("aria-selected","true");inp.setAttribute("aria-activedescendant",opts[i].el.id);opts[i].el.scrollIntoView({block:"nearest"})}
 else inp.removeAttribute("aria-activedescendant");
}
function closeList(){sug.hidden=true;inp.setAttribute("aria-expanded","false");opts=[];act=-1;inp.removeAttribute("aria-activedescendant")}
function group(label,items,type){
 if(!items.length)return;
 sug.appendChild(el("div","sg",label)).setAttribute("role","presentation");
 items.forEach(function(it){
  var d=el("div","so");d.id="so-"+opts.length;d.setAttribute("role","option");d.setAttribute("aria-selected","false");
  d.appendChild(el("span",null,it.n));d.appendChild(el("small",null,it.c+(it.c===1?" show":" shows")));
  var o={t:type,i:it,el:d};opts.push(o);
  d.onmousedown=function(ev){ev.preventDefault()};   // keep focus in the box
  d.onclick=function(){choose(o,true)};
  sug.appendChild(d)});
}
function suggest(){
 var t=norm(inp.value);
 if(t.length<2){closeList();return}
 sug.textContent="";opts=[];act=-1;
 group("Artists",pick(ALIST,t),"a");
 group("Venues",pick(VLIST,t,function(v){return st.venues.indexOf(v.n)>=0}),"v");
 if(!opts.length)sug.appendChild(el("div","sno","No artist or venue matches \u201c"+inp.value.trim()+"\u201d. Press Enter to search artist names anyway."));
 sug.hidden=false;inp.setAttribute("aria-expanded","true");inp.removeAttribute("aria-activedescendant");
}
function syncSel(){
 sel.textContent="";
 function c(label,aria,fn){var b=el("button","chip",label+" \u2715");b.type="button";b.setAttribute("aria-pressed","true");b.setAttribute("aria-label","Remove filter: "+aria);b.onclick=fn;sel.appendChild(b)}
 st.venues.forEach(function(v){c(v,v,function(){st.venues.splice(st.venues.indexOf(v),1);save();syncSel();render()})});
 if(q.k)c("\u201c"+q.label+"\u201d","artist "+q.label,function(){q.k=q.label="";syncSel();render()});
 sel.hidden=!sel.firstChild;
}
function addVenue(n){if(st.venues.indexOf(n)<0)st.venues.push(n);save();syncSel();render()}
function setArtist(label){var k=norm(label);if(!k)return;q.k=k;q.label=label.trim().replace(/\s+/g," ");syncSel();render()}
function resetBox(){clearTimeout(timer);inp.value="";qclear.hidden=true;closeList()}
function choose(o,pointer){if(o.t==="v")addVenue(o.i.n);else setArtist(o.i.n);resetBox();if(pointer)inp.blur()}
function clearSearch(){st.venues=[];q.k=q.label="";save();syncSel();resetBox();render()}
inp.addEventListener("input",function(){qclear.hidden=!inp.value;clearTimeout(timer);
 if(norm(inp.value).length<2){closeList();return}
 timer=setTimeout(suggest,150)});
inp.addEventListener("focus",function(){if(norm(inp.value).length>=2&&sug.hidden)suggest()});
inp.addEventListener("keydown",function(ev){
 var k=ev.key;
 if(k==="ArrowDown"||k==="ArrowUp"){
  ev.preventDefault();clearTimeout(timer);
  if(sug.hidden)suggest();
  if(!opts.length)return;
  setAct(k==="ArrowDown"?(act+1)%opts.length:(act<=0?opts.length-1:act-1));
 }else if(k==="Enter"){
  ev.preventDefault();clearTimeout(timer);
  if(!sug.hidden&&act>=0&&opts[act])choose(opts[act],false);
  else if(norm(inp.value)){setArtist(inp.value);resetBox()}
 }else if(k==="Escape"){if(!sug.hidden){ev.preventDefault();closeList()}}
});
qclear.onclick=function(){resetBox();inp.focus()};
document.addEventListener("pointerdown",function(ev){if(!sbar.contains(ev.target))closeList()});
// ---- jump to date (scrolls only; not saved; shareable as #YYYY-MM-DD) ----
var jumpIn=document.getElementById("jump-date"),quick=document.getElementById("quick");
var ISO=/^\d{4}-\d{2}-\d{2}$/;
function addDays(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dow(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay()}
var lastDay="";EV.forEach(function(e){if(e.d>lastDay)lastDay=e.d});
function setupJump(){
 var today=todayISO();jumpIn.min=today;if(lastDay)jumpIn.max=lastDay;
 quick.textContent="";
 var picks=[[today,"Today"]];
 [5,6,0].forEach(function(w){var d=today;while(dow(d)!==w)d=addDays(d,1);
  if(d!==today)picks.push([d,DOW[w]])});
 picks.sort(function(a,b){return a[0]<b[0]?-1:1});
 picks.forEach(function(p){if(lastDay&&p[0]>lastDay)return;
  var b=el("button","chip",p[1]);b.type="button";b.title=fmtDay(p[0]);
  b.onclick=function(){jumpTo(p[0],true)};quick.appendChild(b)});
}
function jumpTo(iso,setHash){
 if(!ISO.test(iso))return;
 var need=Math.ceil((Date.parse(iso+"T12:00:00")-Date.parse(START+"T12:00:00")+864e5)/(7*864e5));   // weeks up to and including iso
 if(need>shown){shown=Math.min(WEEKS,Math.ceil(need/STEP)*STEP);render()}                        // a date in a closed week opens it (not remembered)
 var secs=daysEl.querySelectorAll("section.day"),target=null;
 for(var i=0;i<secs.length;i++){if(secs[i].getAttribute("data-date")>=iso){target=secs[i];break}}
 jumpIn.value=iso;
 if(setHash){try{history.replaceState(null,"","#"+iso)}catch(e){}}
 if(!target){statusEl.textContent="No shows on or after "+fmtDay(iso)+(active()||searching()?" with these filters.":".");return}
 target.scrollIntoView({behavior:smooth()?"smooth":"auto",block:"start"});
 var td=target.getAttribute("data-date");
 if(td!==iso)statusEl.textContent="No shows on "+fmtDay(iso)+(active()||searching()?" with these filters":"")+"; showing "+fmtDay(td)+".";
}
jumpIn.onchange=function(){if(jumpIn.value)jumpTo(jumpIn.value,true)};
jumpIn.addEventListener("click",function(){try{if(jumpIn.showPicker)jumpIn.showPicker()}catch(e){}});
function fromHash(){var h=location.hash.slice(1);if(ISO.test(h))jumpTo(h,false)}
window.addEventListener("hashchange",fromHash);
syncUI();syncSel();render();setupJump();fromHash();
})();
</script>
